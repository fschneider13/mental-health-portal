[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auora-model"
version = "0.1.0"
description = "Python reimplementation of the Auora SaaS financial model"
authors = [{name = "Generated by ChatGPT"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "typer>=0.9",
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "pydantic>=2.5"
]

[project.optional-dependencies]
test = ["pytest>=7.4", "typer[all]>=0.9"]

[project.scripts]
auora-model = "auora_model.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["auora_model*"]
